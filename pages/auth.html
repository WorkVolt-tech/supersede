<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSede — Sign In</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<div class="auth-outer">
  <div class="auth-card parchment">
    <p class="auth-sys">SYSTEM ACCESS</p>
    <h1 class="auth-title">SuperSede</h1>
    <p class="auth-sub" id="auth-sub">Welcome back, player.</p>

    <div class="auth-form">
      <label class="auth-label">Email</label>
      <input class="auth-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">

      <label class="auth-label">Password</label>
      <input class="auth-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">

      <div id="confirm-row" style="display:none">
        <label class="auth-label">Confirm Password</label>
        <input class="auth-input" type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
      </div>

      <p class="auth-error" id="auth-error"></p>
      <button class="auth-btn" id="submit-btn">Enter ›</button>
    </div>

    <button class="auth-toggle" id="toggle-btn">No account? Sign up.</button>
  </div>
</div>

<script type="module">
  import { supabase } from '../supabase.js'

  let mode = 'login'

  function setMode(m) {
    mode = m
    const isSignup = m === 'signup'
    document.getElementById('confirm-row').style.display = isSignup ? 'block' : 'none'
    document.getElementById('auth-sub').textContent = isSignup ? 'Create your account.' : 'Welcome back, player.'
    document.getElementById('submit-btn').textContent = isSignup ? 'Register ›' : 'Enter ›'
    document.getElementById('toggle-btn').textContent = isSignup ? 'Already registered? Log in.' : 'No account? Sign up.'
    document.getElementById('auth-error').textContent = ''
    document.getElementById('password').autocomplete = isSignup ? 'new-password' : 'current-password'
  }

  document.getElementById('toggle-btn').addEventListener('click', () => {
    setMode(mode === 'login' ? 'signup' : 'login')
  })

  async function checkNeedsSetup(userId) {
    const { data, error } = await supabase
      .from('players')
      .select('username')
      .eq('user_id', userId)
      .maybeSingle()
    
    if (error || !data) return true
    return data.username?.startsWith('Player_') || false
  }

  document.getElementById('submit-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const confirmEl = document.getElementById('confirm')
    const confirm = confirmEl ? confirmEl.value : ''
    const errorEl = document.getElementById('auth-error')
    const btn = document.getElementById('submit-btn')

    errorEl.textContent = ''

    if (!email || !password) { 
      errorEl.textContent = 'Email and password are required.'
      return 
    }
    
    if (mode === 'signup') {
      if (password.length < 6) { 
        errorEl.textContent = 'Password must be at least 6 characters.'
        return 
      }
      if (password !== confirm) { 
        errorEl.textContent = 'Passwords do not match.'
        return 
      }
    }

    btn.textContent = 'Connecting…'
    btn.disabled = true

    if (mode === 'login') {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })
      btn.disabled = false
      btn.textContent = 'Enter ›'
      
      if (error) { 
        errorEl.textContent = error.message
        return 
      }
      
      const needsSetup = await checkNeedsSetup(data.user.id)
      if (needsSetup) {
        window.location.href = 'setup.html'
      } else {
        window.location.href = 'book.html'
      }

    } else {
      const tempUsername = 'Player_' + Math.random().toString(36).slice(2, 7).toUpperCase()
      
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { username: tempUsername } }
      })
      
      btn.disabled = false
      btn.textContent = 'Register ›'
      
      if (error) { 
        errorEl.textContent = error.message
        return 
      }

      const userId = data.user?.id
      if (userId) {
        const { error: pErr } = await supabase.from('players').insert({
          user_id: userId,
          username: tempUsername,
          level: 1,
          xp: 0,
          hp: 100,
          max_hp: 100,
          gold: 0,
          badge: 'neutral',
          reputation: 'neutral',
          chapters_unlocked: [1]
        })
        
        if (pErr) {
          console.error('Player creation error:', pErr)
          errorEl.textContent = 'Account created but profile setup failed.'
          return
        }
      }

      const { error: signInErr } = await supabase.auth.signInWithPassword({ email, password })
      if (signInErr) {
        errorEl.textContent = 'Account created! Please log in.'
        setMode('login')
        return
      }
      
      window.location.href = 'setup.html'
    }
  })

  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('submit-btn').click()
  })
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('submit-btn').click()
  })
</script>
</body>
</html>
