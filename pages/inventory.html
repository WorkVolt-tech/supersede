<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSede — Inventory</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<div class="book-wrap">
  <div id="nav"></div>

  <div class="book animate-in">
    <div class="page-left parchment">
      <div class="page-inner">
        <p class="chapter-label">Equipment</p>
        <h1 class="page-title">Loadout</h1>
        <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;color:#7a6435;margin-bottom:.5rem" id="equip-hint">Select an item from the right, then click a slot.</p>
        <hr class="ink-divider">
        <div id="equip-slots"></div>
        <hr class="ink-divider">
        <div id="total-stats" style="font-family:'Share Tech Mono',monospace;font-size:.65rem;color:#7a6435;display:flex;gap:1.5rem;letter-spacing:.06em"></div>
      </div>
    </div>

    <div class="spine"></div>

    <div class="page-right parchment">
      <div class="page-inner">
        <p class="chapter-label">Item Bag</p>
        <h2 class="page-title" id="bag-count">— items</h2>
        <hr class="ink-divider">
        <div style="display:flex;gap:3px;margin-bottom:.75rem;flex-wrap:wrap" id="filter-tabs"></div>
        <div class="item-grid" id="item-grid"></div>
        <div id="item-detail"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { supabase }           from '../supabase.js'
  import { renderNav, showToast } from '../components/nav.js'

const ITEM_IMAGES = {
  'ember_blade':'../assets/weapon/fire/ember_blade.png',
  'flame_dagger':'../assets/weapon/fire/flame_dagger.png',
  'inferno_sword':'../assets/weapon/fire/inferno_sword.png',
  'burning_staff':'../assets/weapon/fire/burning_staff.png',
  'ashen_tome':'../assets/weapon/fire/ashen_tome.png',
  'lava_gauntlets':'../assets/weapon/fire/lava_gauntlets.png',
  'tide_blade':'../assets/weapon/water/tide_blade.png',
  'ocean_staff':'../assets/weapon/water/ocean_staff.png',
  'flow_dagger':'../assets/weapon/water/flow_dagger.png',
  'deep_tome':'../assets/weapon/water/deep_tome.png',
  'current_gauntlets':'../assets/weapon/water/current_gauntlets.png',
  'stone_sword':'../assets/weapon/earth/stone_sword.png',
  'root_blade':'../assets/weapon/earth/root_blade.png',
  'titan_hammer':'../assets/weapon/earth/titan_hammer.png',
  'crystal_staff':'../assets/weapon/earth/crystal_staff.png',
  'boulder_gauntlets':'../assets/weapon/earth/boulder_gauntlets.png',
  'wind_dagger':'../assets/weapon/air/wind_dagger.png',
  'gale_blade':'../assets/weapon/air/gale_blade.png',
  'storm_sword':'../assets/weapon/air/storm_sword.png',
  'sky_staff':'../assets/weapon/air/sky_staff.png',
  'swift_gauntlets':'../assets/weapon/air/swift_gauntlets.png',
  'shadow_blade':'../assets/weapon/dark/shadow_blade.png',
  'void_dagger':'../assets/weapon/dark/void_dagger.png',
  'curse_sword':'../assets/weapon/dark/curse_sword.png',
  'nightmare_staff':'../assets/weapon/dark/nightmare_staff.png',
  'abyss_gauntlets':'../assets/weapon/dark/abyss_gauntlets.png',
  'radiant_blade':'../assets/weapon/light/radiant_blade.png',
  'halo_staff':'../assets/weapon/light/halo_staff.png',
  'dawn_sword':'../assets/weapon/light/dawn_sword.png',
  'blessing_tome':'../assets/weapon/light/blessing_tome.png',
  'light_gauntlets':'../assets/weapon/light/light_gauntlets.png',
  'cinder_armor':'../assets/armor/cinder_armor.png',
  'inferno_cloak':'../assets/armor/inferno_cloak.png',
  'blazing_robes':'../assets/armor/blazing_robes.png',
  'smoke_veil':'../assets/armor/smoke_veil.png',
  'mist_cloak':'../assets/armor/mist_cloak.png',
  'ocean_armor':'../assets/armor/ocean_armor.png',
  'rain_robes':'../assets/armor/rain_robes.png',
  'tide_shield':'../assets/armor/tide_shield.png',
  'rock_armor':'../assets/armor/rock_armor.png',
  'root_cloak':'../assets/armor/root_cloak.png',
  'terra_plate':'../assets/armor/terra_plate.png',
  'crystal_shell':'../assets/armor/crystal_shell.png',
  'feather_cloak':'../assets/armor/feather_cloak.png',
  'storm_armor':'../assets/armor/storm_armor.png',
  'cloud_robes':'../assets/armor/cloud_robes.png',
  'wind_veil':'../assets/armor/wind_veil.png',
  'shadow_cloak':'../assets/armor/shadow_cloak.png',
  'void_armor':'../assets/armor/void_armor.png',
  'nightmare_robes':'../assets/armor/nightmare_robes.png',
  'curse_shell':'../assets/armor/curse_shell.png',
  'holy_armor':'../assets/armor/holy_armor.png',
  'blessing_cloak':'../assets/armor/blessing_cloak.png',
  'radiant_robes':'../assets/armor/radiant_robes.png',
  'halo_shield':'../assets/armor/halo_shield.png',
  'rune_ignis':'../assets/runes/rune_ignis.png',
  'rune_aqua':'../assets/runes/rune_aqua.png',
  'rune_terra':'../assets/runes/rune_terra.png',
  'rune_aero':'../assets/runes/rune_aero.png',
  'rune_umbra':'../assets/runes/rune_umbra.png',
  'rune_lux':'../assets/runes/rune_lux.png',
}
function getItemImg(k) { return ITEM_IMAGES[k] || null }


  const SLOTS = [
    { key:'helmet',     label:'Helmet',      icon:'⛑',  accepts:['helmet'] },
    { key:'chest',      label:'Chest',       icon:'🦺', accepts:['chest'] },
    { key:'gloves',     label:'Gloves',      icon:'🧤', accepts:['gloves'] },
    { key:'boots',      label:'Boots',       icon:'👢', accepts:['boots'] },
    { key:'accessory1', label:'Accessory 1', icon:'💍', accepts:['accessory'] },
    { key:'accessory2', label:'Accessory 2', icon:'📿', accepts:['accessory'] },
    { key:'mainhand',   label:'Weapon',      icon:'🗡',  accepts:['sword','dagger','staff','bow','spear','shield'] },
    { key:'offhand',    label:'Off-hand',    icon:'🛡',  accepts:['shield','dagger','tome','sword'] },
  ]

  const RARITY = { common:'#888', uncommon:'#5ec45e', rare:'#5eaee0', epic:'#a07de0', legendary:'#c8b96e' }
  const FILTERS = ['all','weapon','armor','consumable','material','key']

  let player = await renderNav('nav')
  if (!player) throw new Error('no player')

  let items = [], selectedId = null, filter = 'all'

  async function load() {
    const { data } = await supabase.from('inventory').select('*').eq('player_id', player.id).order('obtained_at',{ascending:false})
    items = data || []
    render()
  }

  function render() {
    renderSlots()
    renderGrid()
    renderStats()
  }

  function renderSlots() {
    const equipped = {}
    items.filter(i=>i.equipped_slot).forEach(i=>{ equipped[i.equipped_slot]=i })
    document.getElementById('equip-slots').innerHTML = SLOTS.map(s => {
      const item = equipped[s.key]
      const EL_COLORS = {fire:'#ff5500',water:'#0088ff',earth:'#8b5e3c',air:'#a8d8ea',dark:'#b06eff',light:'#ffd700',none:'#9a8050'}
      const elColor = item ? (EL_COLORS[item.element] || '#9a8050') : '#9a8050'
      return `<div class="equip-slot${selectedId?' clickable':''}" data-slot="${s.key}" title="${item?item.name+' — click to unequip':s.label}">
        ${(()=>{if(!item)return '<span class="slot-icon">'+s.icon+'</span>';const _s=getItemImg(item.item_key);return _s?('<img src="'+_s+'" class="slot-icon" style="width:28px;height:28px;object-fit:contain" onerror="this.style.display=\'none\'">'):'<span class="slot-icon">'+item.icon+'</span>';})()}
        <span class="slot-label" style="color:${item ? (RARITY[item.rarity]||elColor) : '#9a8050'}">${item ? item.name : s.label}</span>
        ${item ? `<span style="font-family:'Share Tech Mono',monospace;font-size:.48rem;color:${elColor}">${item.element && item.element!=='none' ? item.element.toUpperCase() : 'EQ'}</span>` : ''}
      </div>`
    }).join('')

    document.querySelectorAll('.equip-slot').forEach(el => {
      el.addEventListener('click', async () => {
        const slot = el.dataset.slot
        if (selectedId) {
          await equipItem(selectedId, slot)
        } else {
          const item = items.find(i=>i.equipped_slot===slot)
          if (item) await unequipSlot(slot)
        }
      })
    })
  }

  function renderGrid() {
    const filtered = items.filter(i=>filter==='all'||i.item_type===filter)
    document.getElementById('bag-count').textContent = items.length + ' items'
    document.getElementById('item-grid').innerHTML = filtered.map(item => `
      <div class="item-card${selectedId===item.id?' selected':''}" data-id="${item.id}">
        ${(()=>{const _s=getItemImg(item.item_key);return _s?('<img src="'+_s+'" class="item-icon" style="width:32px;height:32px;object-fit:contain" onerror="this.style.display=\'none\'">'):'<span class="item-icon">'+(item.icon||'📦')+'</span>';})()}
        <p class="item-name" style="color:${RARITY[item.rarity]||'#888'}">${item.name}</p>
        <p class="item-type">${item.subtype||item.item_type}</p>
        ${item.quantity>1?`<span class="item-qty">×${item.quantity}</span>`:''}
        ${item.equipped_slot?`<span class="item-eq">EQ</span>`:''}
        ${(item.sockets_total||0)>0?`<span style="position:absolute;bottom:4px;left:4px;font-size:.45rem;color:#a07de0;font-family:'Share Tech Mono',monospace">${item.sockets_used||0}/${item.sockets_total}◈</span>`:''} 
      </div>
    `).join('') || `<p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.88rem;color:#7a6435;grid-column:span 3">Nothing here.</p>`

    document.querySelectorAll('.item-card').forEach(el => {
      el.addEventListener('click', () => {
        selectedId = selectedId === el.dataset.id ? null : el.dataset.id
        render()
        renderDetail()
      })
    })
  }

  function renderStats() {
    const eq   = items.filter(i=>i.equipped_slot)
    const atk  = 1 + eq.reduce((s,i)=>s+(i.atk_bonus||0),0)
    const def  =     eq.reduce((s,i)=>s+(i.def_bonus||0),0)
    const pwr  =     eq.reduce((s,i)=>s+(i.power_bonus||0),0)
    const ctr  =     eq.reduce((s,i)=>s+(i.control_bonus||0),0)
    const grd  =     eq.reduce((s,i)=>s+(i.guard_bonus||0),0)
    const spd  =     eq.reduce((s,i)=>s+(i.speed_bonus||0),0)
    const ins  =     eq.reduce((s,i)=>s+(i.insight_bonus||0),0)
    const lck  =     eq.reduce((s,i)=>s+(i.luck_bonus||0),0)
    document.getElementById('total-stats').innerHTML = `
      <span>ATK <strong style="color:#e05555">${atk}</strong></span>
      <span>DEF <strong style="color:#5ec45e">${def}</strong></span>
      ${pwr?`<span>PWR <strong style="color:#ff5500">${pwr}</strong></span>`:''}
      ${ctr?`<span>CTR <strong style="color:#0088ff">${ctr}</strong></span>`:''}
      ${grd?`<span>GRD <strong style="color:#8b5e3c">${grd}</strong></span>`:''}
      ${spd?`<span>SPD <strong style="color:#a8d8ea">${spd}</strong></span>`:''}
      ${ins?`<span>INS <strong style="color:#ffd700">${ins}</strong></span>`:''}
      ${lck?`<span>LCK <strong style="color:#b06eff">${lck}</strong></span>`:''}
    `
  }

  function renderDetail() {
    const el = document.getElementById('item-detail')
    if (!selectedId) { el.innerHTML=''; return }
    const item = items.find(i=>i.id===selectedId)
    if (!item) { el.innerHTML=''; return }
    el.innerHTML = `
      <div style="border:0.5px solid rgba(139,106,32,.3);border-radius:3px;padding:.75rem;margin-top:.5rem;background:rgba(0,0,0,.05)">
        <div style="display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.5rem">
          ${(()=>{const _s=getItemImg(item.item_key);return _s?('<img src="'+_s+'" style="width:52px;height:52px;object-fit:contain;border-radius:6px" onerror="this.style.display=\'none\'">'):'<span style="font-size:1.6rem">'+(item.icon||'📦')+'</span>';})()}
          <div>
            <p style="font-family:'Cinzel',serif;font-size:.88rem;font-weight:600;color:${RARITY[item.rarity]||'#888'};margin:0 0 2px">${item.name}</p>
            <p style="font-family:'Share Tech Mono',monospace;font-size:.58rem;color:#7a6435;margin:0;letter-spacing:.06em">${item.rarity} · ${item.subtype||item.item_type}${item.two_handed?' · 2H':''}</p>
          </div>
        </div>
        <div style="display:flex;gap:.75rem;font-family:'Share Tech Mono',monospace;font-size:.65rem;margin-bottom:.6rem;flex-wrap:wrap">
          ${item.atk_bonus>0?`<span style="color:#e05555">ATK +${item.atk_bonus}</span>`:''}
          ${item.def_bonus>0?`<span style="color:#5ec45e">DEF +${item.def_bonus}</span>`:''}
          ${item.hp_restore>0?`<span style="color:#5eaee0">+${item.hp_restore} HP</span>`:''}
          ${!item.atk_bonus&&!item.def_bonus&&!item.hp_restore?`<span style="color:#7a6435">Utility item</span>`:''}
        </div>
        ${(item.sockets_total||0) > 0 ? `
          <div style="margin-bottom:.5rem">
            <p style="font-family:'Share Tech Mono',monospace;font-size:.55rem;color:#a07de0;letter-spacing:.07em;margin-bottom:3px">SOCKETS ${item.sockets_used||0}/${item.sockets_total}</p>
            <div style="display:flex;gap:4px;margin-bottom:4px">
              ${Array.from({length:item.sockets_total||0}).map((_,i) => {
                const rune = (item.socketed_runes||[])[i]
                const runeColors = {ignis:'#ff5500',aqua:'#0088ff',terra:'#8b5e3c',aero:'#a8d8ea',umbra:'#b06eff',lux:'#ffd700'}
                const runeIcons  = {ignis:'🔥',aqua:'💧',terra:'🪨',aero:'💨',umbra:'🌑',lux:'✨'}
                const color = rune ? (runeColors[rune]||'#a07de0') : 'rgba(160,125,224,.3)'
                return '<div style="width:22px;height:22px;border-radius:50%;border:1.5px solid '+color+';display:flex;align-items:center;justify-content:center;font-size:.75rem;background:'+(rune?color+'22':'rgba(0,0,0,.15)')+'" title="'+(rune||'Empty socket')+'">'+(rune?(runeIcons[rune]||'?'):'○')+'</div>'
              }).join('')}
            </div>
            ${item.runeword_name ? '<p style="font-family:\'Cinzel\',serif;font-size:.68rem;color:#a07de0;margin-top:2px">✦ '+item.runeword_name+'</p>' : ''}
            ${(item.sockets_used||0) < (item.sockets_total||0) ? '<button onclick="openRunePicker(\''+item.id+'\',\''+item.item_type+'\')" style="font-family:\'Cinzel\',serif;font-size:.68rem;color:#a07de0;background:none;border:.5px solid #a07de060;border-radius:3px;padding:3px 10px;cursor:pointer;margin-top:4px">✦ Add Rune</button>' : ''}
            ${(item.sockets_used||0) > 0 ? '<button onclick="removeRunes(\''+item.id+'\')" style="font-family:\'Cinzel\',serif;font-size:.68rem;color:#7a6435;background:none;border:.5px solid rgba(139,106,32,.3);border-radius:3px;padding:3px 10px;cursor:pointer;margin-top:4px;margin-left:4px">Remove Runes</button>' : ''}
            <div id="rune-picker-${item.id}" style="display:none;margin-top:6px;padding:6px;background:rgba(0,0,0,.08);border-radius:4px;border:.5px solid rgba(160,125,224,.3)"></div>
          </div>
        ` : ''}
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          ${item.item_type==='consumable'?`<button onclick="useItem('${item.id}')" style="font-family:'Cinzel',serif;font-size:.72rem;color:#5eaee0;background:none;border:.5px solid #5eaee040;border-radius:3px;padding:4px 12px;cursor:pointer">Use ×1</button>`:''}
          ${item.equipped_slot?`<button onclick="unequipSlot('${item.equipped_slot}')" style="font-family:'Cinzel',serif;font-size:.72rem;color:#c8b96e;background:none;border:.5px solid #c8b96e40;border-radius:3px;padding:4px 12px;cursor:pointer">Unequip</button>`:''}
          ${!item.equipped_slot?`<button onclick="sellItem('${item.id}','${item.name}',${item.sell_price||Math.max(1,Math.floor((item.buy_price||20)*.4))},${item.quantity||1})" style="font-family:'Cinzel',serif;font-size:.72rem;color:#e05555;background:none;border:.5px solid #e0555540;border-radius:3px;padding:4px 12px;cursor:pointer">Sell ◈${item.sell_price||Math.max(1,Math.floor((item.buy_price||20)*.4))}</button>`:''}
        </div>
      </div>
    `
  }

  async function equipItem(itemId, slot) {
    const item = items.find(i=>i.id===itemId)
    if (!item) return
    const slotDef = SLOTS.find(s=>s.key===slot)
    if (!slotDef.accepts.includes(item.subtype||item.item_type)) {
      showToast(`${item.name} can't go in ${slotDef.label}`, true); return
    }
    // Unequip current in slot
    const current = items.find(i=>i.equipped_slot===slot)
    if (current) await supabase.from('inventory').update({equipped_slot:null}).eq('id',current.id)
    // If 2H, clear offhand
    if (item.two_handed && slot==='mainhand') {
      const oh = items.find(i=>i.equipped_slot==='offhand')
      if (oh) await supabase.from('inventory').update({equipped_slot:null}).eq('id',oh.id)
    }
    await supabase.from('inventory').update({equipped_slot:slot}).eq('id',itemId)
    showToast(`${item.name} equipped`)
    selectedId = null
    await load()
  }

  async function unequipSlot(slot) {
    const item = items.find(i=>i.equipped_slot===slot)
    if (!item) return
    await supabase.from('inventory').update({equipped_slot:null}).eq('id',item.id)
    showToast(`${item.name} unequipped`)
    await load()
  }

  window.unequipSlot = unequipSlot

  // ── Runeword data ──────────────────────────────
  const RUNEWORDS = {
    'ignis+ignis':       {name:'Ember Core',      rarity:'rare',      slot:'weapon',   stats:{power_bonus:2,atk_bonus:2}},
    'aero+ignis':        {name:'Blazing Speed',   rarity:'epic',      slot:'weapon',   stats:{power_bonus:2,speed_bonus:4}},
    'ignis+umbra':       {name:'Hellfire Pact',   rarity:'legendary', slot:'weapon',   stats:{power_bonus:6,atk_bonus:4}},
    'ignis+terra':       {name:'Molten Strike',   rarity:'rare',      slot:'weapon',   stats:{power_bonus:2,atk_bonus:3,guard_bonus:1}},
    'aqua+ignis':        {name:'Steam Burst',     rarity:'epic',      slot:'weapon',   stats:{power_bonus:2,control_bonus:2}},
    'aqua+aqua':         {name:'Flow State',      rarity:'rare',      slot:'weapon',   stats:{control_bonus:3,luck_bonus:2}},
    'aqua+lux':          {name:'Sacred Tide',     rarity:'epic',      slot:'weapon',   stats:{control_bonus:2,insight_bonus:2}},
    'aero+aqua':         {name:'Current Shift',   rarity:'epic',      slot:'weapon',   stats:{control_bonus:3,speed_bonus:2}},
    'aqua+umbra':        {name:'Drowning Curse',  rarity:'legendary', slot:'weapon',   stats:{control_bonus:5,power_bonus:2}},
    'aqua+terra':        {name:'Deep Stability',  rarity:'rare',      slot:'weapon',   stats:{control_bonus:2,guard_bonus:2}},
    'aero+aero':         {name:'Wind Fury',       rarity:'rare',      slot:'weapon',   stats:{speed_bonus:4,luck_bonus:2}},
    'aero+umbra':        {name:'Phantom Strike',  rarity:'legendary', slot:'weapon',   stats:{speed_bonus:4,power_bonus:3}},
    'umbra+umbra':       {name:'Abyss Core',      rarity:'epic',      slot:'weapon',   stats:{power_bonus:5,atk_bonus:3}},
    'lux+lux':           {name:'Radiant Edge',    rarity:'rare',      slot:'weapon',   stats:{insight_bonus:2,luck_bonus:2,guard_bonus:1}},
    'ignis+lux':         {name:'Holy Flame',      rarity:'epic',      slot:'weapon',   stats:{power_bonus:2,insight_bonus:2,atk_bonus:2}},
    'aero+lux':          {name:'Light Speed',     rarity:'epic',      slot:'weapon',   stats:{speed_bonus:3,insight_bonus:2}},
    'terra+terra':       {name:'Stone Skin',      rarity:'rare',      slot:'armor',    stats:{guard_bonus:5,def_bonus:3}},
    'lux+terra':         {name:'Sanctuary',       rarity:'epic',      slot:'armor',    stats:{guard_bonus:3,insight_bonus:2,def_bonus:2}},
    'aqua+terra':        {name:'Living Armor',    rarity:'rare',      slot:'armor',    stats:{guard_bonus:2,def_bonus:2}},
    'terra+umbra':       {name:'Grave Shell',     rarity:'epic',      slot:'armor',    stats:{guard_bonus:4,def_bonus:4}},
    'aero+terra':        {name:'Dust Guard',      rarity:'rare',      slot:'armor',    stats:{guard_bonus:2,speed_bonus:2,def_bonus:2}},
    'aero+lux+armor':    {name:"Heaven's Grace",  rarity:'epic',      slot:'armor',    stats:{guard_bonus:2,speed_bonus:3,def_bonus:1}},
    'ignis+lux+armor':   {name:'Phoenix Guard',   rarity:'legendary', slot:'armor',    stats:{guard_bonus:2,def_bonus:2,power_bonus:1}},
    'lux+terra+uni':     {name:'Harmony',         rarity:'rare',      slot:'any',      stats:{power_bonus:1,control_bonus:1,guard_bonus:1,speed_bonus:1}},
    'aqua+ignis+uni':    {name:'Balance Break',   rarity:'epic',      slot:'any',      stats:{control_bonus:3,power_bonus:2}},
    'lux+umbra+uni':     {name:'Twilight Core',   rarity:'legendary', slot:'any',      stats:{power_bonus:3,guard_bonus:2,insight_bonus:2}},
  }

  function findRuneword(runes, slot) {
    const key = [...runes].sort().join('+')
    if (RUNEWORDS[key]) return RUNEWORDS[key]
    // Try with slot suffix
    const suffixes = ['uni', slot==='accessory'?'acc':null, slot==='armor'?'armor':null].filter(Boolean)
    for (const s of suffixes) {
      const k2 = [...runes,s].sort().join('+')
      if (RUNEWORDS[k2]) return RUNEWORDS[k2]
    }
    return null
  }

  // ── Open inline rune picker ──────────────────────
  window.openRunePicker = async function(itemId, itemType) {
    const pickerId = 'rune-picker-' + itemId
    const picker   = document.getElementById(pickerId)
    if (!picker) return

    // Toggle
    if (picker.style.display !== 'none') { picker.style.display = 'none'; return }
    picker.style.display = 'block'
    picker.innerHTML = '<p style="font-family:\'Share Tech Mono\',monospace;font-size:.58rem;color:#9a8050">Loading runes…</p>'

    // Load runes from inventory
    const { data: runeItems } = await supabase.from('inventory')
      .select('*').eq('player_id', player.id).like('item_key','rune_%').gt('quantity',0)

    if (!runeItems || !runeItems.length) {
      picker.innerHTML = '<p style="font-family:\'IM Fell English\',serif;font-style:italic;font-size:.8rem;color:#7a6435">No runes in inventory.<br>Farm enemies to find runes.</p>'
      return
    }

    const RUNE_COLORS = {ignis:'#ff5500',aqua:'#0088ff',terra:'#8b5e3c',aero:'#a8d8ea',umbra:'#b06eff',lux:'#ffd700'}
    const RUNE_ICONS  = {ignis:'🔥',aqua:'💧',terra:'🪨',aero:'💨',umbra:'🌑',lux:'✨'}
    const RUNE_NAMES  = {ignis:'Ignis',aqua:'Aqua',terra:'Terra',aero:'Aero',umbra:'Umbra',lux:'Lux'}

    picker.innerHTML = `
      <p style="font-family:'Share Tech Mono',monospace;font-size:.55rem;color:#a07de0;letter-spacing:.07em;margin-bottom:5px">SELECT RUNE TO SOCKET</p>
      <div style="display:flex;flex-wrap:wrap;gap:5px">
        ${runeItems.map(r => {
          const key   = r.item_key.replace('rune_','')
          const color = RUNE_COLORS[key] || '#888'
          const icon  = RUNE_ICONS[key]  || '?'
          const name  = RUNE_NAMES[key]  || key
          return `<button onclick="socketRuneToItem('${itemId}','${r.id}','${key}','${itemType}')"
            style="display:flex;align-items:center;gap:4px;background:${color}18;border:1px solid ${color}60;border-radius:4px;padding:4px 8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:.6rem;color:${color}">
            <span>${icon}</span><span>${name}</span><span style="color:#7a6435;font-size:.5rem">×${r.quantity}</span>
          </button>`
        }).join('')}
      </div>
    `
  }

  // ── Socket a rune into an item ───────────────────
  window.socketRuneToItem = async function(itemId, runeInventoryId, runeKey, itemType) {
    const item = items.find(i => i.id === itemId)
    if (!item) return

    const sockets = item.sockets_total || 0
    const used    = item.sockets_used  || 0
    if (used >= sockets) { showToast('All sockets filled', true); return }

    const newRunes  = [...(item.socketed_runes||[]), runeKey]
    const newUsed   = used + 1

    // Check for runeword
    const slot = itemType === 'armor' ? 'armor' : itemType === 'weapon' ? 'weapon' : 'accessory'
    const rw   = findRuneword(newRunes, slot)

    // Build stat updates from runeword
    const statUpdates = {}
    if (rw) Object.entries(rw.stats).forEach(([k,v]) => { statUpdates[k] = (item[k]||0) + v })

    await supabase.from('inventory').update({
      socketed_runes:  newRunes,
      sockets_used:    newUsed,
      runeword_name:   rw ? rw.name   : (item.runeword_name  || null),
      runeword_effect: rw ? rw.effect : (item.runeword_effect || null),
      ...statUpdates,
    }).eq('id', itemId)

    // Consume the rune
    const runeItem = items.find(i => i.id === runeInventoryId)
    if (runeItem) {
      if ((runeItem.quantity||1) <= 1) {
        await supabase.from('inventory').delete().eq('id', runeInventoryId)
      } else {
        await supabase.from('inventory').update({ quantity: runeItem.quantity - 1 }).eq('id', runeInventoryId)
      }
    }

    if (rw) showToast('✦ Runeword activated: ' + rw.name + '!')
    else    showToast('Rune socketed — ' + newRunes.length + '/' + sockets + ' filled')

    selectedId = itemId
    await load()
  }

  // ── Remove all runes from an item ───────────────
  window.removeRunes = async function(itemId) {
    const item = items.find(i => i.id === itemId)
    if (!item || !(item.sockets_used > 0)) return

    // Refund runes to inventory
    for (const runeKey of (item.socketed_runes||[])) {
      const runeItemKey = 'rune_' + runeKey
      const { data: ex } = await supabase.from('inventory').select('*')
        .eq('player_id', player.id).eq('item_key', runeItemKey).maybeSingle()
      if (ex) {
        await supabase.from('inventory').update({ quantity: ex.quantity + 1 }).eq('id', ex.id)
      } else {
        const { data: m } = await supabase.from('items').select('*').eq('item_key', runeItemKey).single()
        if (m) await supabase.from('inventory').insert({
          player_id:player.id, item_key:runeItemKey, name:m.name,
          item_type:'material', rarity:m.rarity, icon:m.icon,
          element:m.element, quantity:1
        })
      }
    }

    // Clear rune stats (reset bonus stats)
    await supabase.from('inventory').update({
      socketed_runes:[], sockets_used:0,
      runeword_name:null, runeword_effect:null,
      power_bonus:0, control_bonus:0, guard_bonus:0,
      speed_bonus:0, insight_bonus:0, luck_bonus:0,
    }).eq('id', itemId)

    showToast('Runes removed — returned to inventory')
    selectedId = itemId
    await load()
  }

  window.sellItem = async (itemId, itemName, sellPrice, qty) => {
    if (qty > 1) {
      // Sell one at a time
      await supabase.from('inventory').update({ quantity: qty - 1 }).eq('id', itemId)
    } else {
      await supabase.from('inventory').delete().eq('id', itemId)
    }
    const newGold = (player.gold || 0) + sellPrice
    await supabase.from('players').update({ gold: newGold }).eq('id', player.id)
    player.gold = newGold
    showToast('Sold ' + itemName + ' for ◈' + sellPrice)
    selectedId = null
    await load()
  }

  window.useItem = async (itemId) => {
    const item = items.find(i=>i.id===itemId)
    if (!item || item.item_type !== 'consumable') return

    // ── Fetch current player HP from DB (always fresh) ──
    const { data: freshPlayer } = await supabase
      .from('players').select('hp,max_hp').eq('id', player.id).single()

    const currentHp = freshPlayer?.hp    || 100
    const maxHp     = freshPlayer?.max_hp || 100

    if (item.hp_restore > 0) {
      const newHp = Math.min(maxHp, currentHp + item.hp_restore)
      const healed = newHp - currentHp
      // Save to DB
      await supabase.from('players').update({ hp: newHp }).eq('id', player.id)
      showToast('+' + healed + ' HP restored (' + newHp + '/' + maxHp + ')')
    } else if (item.special_effect) {
      showToast(item.name + ' used — ' + item.special_effect)
    } else {
      showToast(item.name + ' used')
    }

    // Consume item
    const newQty = (item.quantity || 1) - 1
    if (newQty <= 0) {
      await supabase.from('inventory').delete().eq('id', itemId)
    } else {
      await supabase.from('inventory').update({ quantity: newQty }).eq('id', itemId)
    }

    selectedId = null
    await load()
  }

  // Filter tabs
  document.getElementById('filter-tabs').innerHTML = FILTERS.map(f => `
    <button onclick="setFilter('${f}')" id="ftab-${f}" style="font-family:'Share Tech Mono',monospace;font-size:.6rem;letter-spacing:.07em;background:none;border:.5px solid rgba(139,106,32,.2);border-radius:20px;padding:2px 9px;cursor:pointer;color:#7a6435;transition:all .15s">${f}</button>
  `).join('')

  window.setFilter = (f) => {
    filter = f
    FILTERS.forEach(x => {
      const t = document.getElementById('ftab-'+x)
      t.style.background   = x===f ? 'rgba(139,106,32,.15)' : 'none'
      t.style.borderColor  = x===f ? 'rgba(139,106,32,.6)'  : 'rgba(139,106,32,.2)'
      t.style.color        = x===f ? '#1a1208' : '#7a6435'
    })
    renderGrid()
  }

  await load()
</script>
</body>
</html>
