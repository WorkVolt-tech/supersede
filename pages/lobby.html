<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperSede — Lobby</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<div class="book-wrap">
  <div id="nav"></div>
  <div class="book animate-in">
    <div class="page-left parchment">
      <div class="page-inner">
        <p class="chapter-label">Chapter <span id="ch-num">1</span> · Lobby</p>
        <h1 class="page-title">Nearby Players</h1>
        <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem">
          <span style="width:6px;height:6px;border-radius:50%;background:#5ec45e;box-shadow:0 0 4px #5ec45e;display:inline-block;flex-shrink:0"></span>
          <span id="count" style="font-family:'Share Tech Mono',monospace;font-size:.62rem;color:#7a6435;letter-spacing:.06em">0 detected</span>
        </div>
        <hr class="ink-divider">
        <div id="ping-log" style="background:rgba(0,0,0,.06);border-left:2px solid rgba(139,106,32,.3);padding:.6rem .75rem;min-height:44px;border-radius:0 2px 2px 0;margin-bottom:.75rem">
          <p style="font-family:'Share Tech Mono',monospace;font-size:.6rem;color:#7a6435;letter-spacing:.06em">System scanning…</p>
        </div>
        <div id="player-list"></div>
      </div>
    </div>
    <div class="spine"></div>
    <div class="page-right parchment">
      <div class="page-inner">
        <p class="chapter-label">Your Presence</p>
        <h2 class="page-title" id="own-name">—</h2>
        <hr class="ink-divider">
        <div id="own-stats"></div>
        <hr class="ink-divider">
        <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;color:#6b5a35;line-height:1.6;margin-bottom:.75rem">
          Tap a player to reveal encounter options. Alliance requests are sent in real time.
        </p>
        <p style="font-family:'Share Tech Mono',monospace;font-size:.6rem;color:#c04040;text-shadow:0 0 4px #c0404060;letter-spacing:.06em">
          ⚠ Reputation shifts are permanent.
        </p>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { supabase }             from '../supabase.js'

  // ── Admin config ─────────────────────────────────
  // Set this to your Supabase user ID so your cloaked figure appears
  // Find it: Supabase dashboard → Authentication → Users → your email → copy the UUID
  const ADMIN_USER_IDS = new Set([
    'YOUR_USER_ID_HERE',  // ← replace with your actual Supabase user ID
  ])

  function isAdmin(userId) { return ADMIN_USER_IDS.has(userId) }
  import { renderNav, showToast } from '../components/nav.js'

  const BC = { neutral:{label:'Neutral',color:'#c8b96e'}, red:{label:'Hunter',color:'#e05555'}, green:{label:'Helper',color:'#5ec45e'}, elite:{label:'Elite',color:'#a07de0'}, unknown:{label:'Unknown',color:'#666'} }
  const SC = { online:{label:'Online',color:'#5ec45e'}, in_combat:{label:'In Combat',color:'#e05555'}, idle:{label:'Idle',color:'#888'}, boss_fight:{label:'Boss Fight',color:'#a07de0'} }

  let player = await renderNav('nav')
  if (!player) throw new Error('no player')
  let nearby = [], selected = null
  const chapter = player.current_chapter||1

  document.getElementById('ch-num').textContent = chapter
  document.getElementById('own-name').textContent = player.username
  // Show cloaked avatar next to your own name if you're the admin
  if (isAdmin(player.id)) {
    const nameEl = document.getElementById('own-name')
    const wrap = document.createElement('div')
    wrap.style.cssText = 'display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem'
    const img = document.createElement('img')
    img.src   = '../assets/mysterious_cloaked_player.png'
    img.alt   = 'Admin'
    img.style.cssText = 'width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #00ffe7;box-shadow:0 0 12px #00ffe750'
    nameEl.parentNode.insertBefore(wrap, nameEl)
    wrap.appendChild(img)
    wrap.appendChild(nameEl)
    const tag = document.createElement('p')
    tag.style.cssText = 'font-family:\'Share Tech Mono\',monospace;font-size:.6rem;color:#00ffe7;text-shadow:0 0 8px #00ffe7;letter-spacing:.12em'
    tag.textContent = '⚠ ADMIN'
    wrap.appendChild(tag)
  }

  const badgeColor = BC[player.badge]?.color||'#c8b96e'
  document.getElementById('own-stats').innerHTML = [
    ['Badge', `<span style="color:${badgeColor}">${BC[player.badge]?.label||'Neutral'}</span>`],
    ['Level', player.level], ['Chapter', chapter],
    ['Status', `<span style="color:#5ec45e">Online</span>`],
  ].map(([k,v])=>`
    <div style="display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:.5px solid rgba(139,106,32,.15)">
      <span style="font-family:'Share Tech Mono',monospace;font-size:.62rem;color:#9a8050;letter-spacing:.08em">${k}</span>
      <span style="font-family:'Cinzel',serif;font-size:.85rem;color:#1a1208;font-weight:500">${v}</span>
    </div>
  `).join('')

  // Push own presence
  await supabase.from('presence').upsert({
    player_id:player.id, username:player.username,
    chapter, node:player.current_node||'opening',
    badge:player.badge||'neutral', level:player.level||1, status:'online'
  },{onConflict:'player_id'})

  // Load nearby
  async function load() {
    const {data} = await supabase.from('presence').select('*').eq('chapter',chapter).neq('player_id',player.id).order('updated_at',{ascending:false})
    nearby = data||[]
    document.getElementById('count').textContent = nearby.length + ' detected'
    renderList()
  }

  function addPing(msg, badge='neutral') {
    const log = document.getElementById('ping-log')
    const p = document.createElement('p')
    p.style.cssText = 'font-family:\'Share Tech Mono\',monospace;font-size:.6rem;color:#8a7850;margin:0 0 2px;letter-spacing:.04em'
    p.innerHTML = `<span style="color:${BC[badge]?.color||'#c8b96e'}">▲</span> ${msg}`
    log.insertBefore(p, log.firstChild)
    while(log.children.length>5) log.removeChild(log.lastChild)
  }

  function renderList() {
    const el = document.getElementById('player-list')
    if (!nearby.length) { el.innerHTML=`<p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.88rem;color:#7a6435">No other players in this chapter yet.</p>`; return }
    el.innerHTML = nearby.map(p=>{
      const bc = BC[p.badge]||BC.neutral
      const sc = SC[p.status]||SC.online
      const isSel = selected===p.player_id
      return `
        <div data-pid="${p.player_id}" style="border:.5px solid ${isSel?bc.color:bc.color+'30'};border-radius:5px;padding:.7rem .75rem;cursor:pointer;margin-bottom:6px;background:${isSel?'rgba(200,184,128,.1)':'rgba(0,0,0,.04)'};transition:all .15s">
          <div style="display:flex;align-items:center;gap:.6rem">
            ${isAdmin(p.player_id)
            ? '<img src=\'../assets/mysterious_cloaked_player.png\' alt=\'Admin\' style=\'width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid #00ffe7;box-shadow:0 0 10px #00ffe750;flex-shrink:0\'>'
            : '<div style=\'width:32px;height:32px;border-radius:50%;border:1px solid '+bc.color+';display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;background:rgba(0,0,0,.15);color:'+bc.color+';font-family:\'Cinzel\',serif;flex-shrink:0\'>' + p.username[0].toUpperCase() + '</div>'}
            <div style="flex:1;min-width:0">
              <p style="font-family:'Cinzel',serif;font-size:.82rem;color:#1a1208;margin:0 0 1px">${p.username}</p>
              <p style="font-family:'Share Tech Mono',monospace;font-size:.56rem;color:#7a6435;margin:0;letter-spacing:.04em">Lvl ${p.level} · ${p.node} · <span style="color:${sc.color}">${sc.label}</span></p>
            </div>
            <span style="font-family:'Share Tech Mono',monospace;font-size:.56rem;border:.5px solid ${bc.color+'40'};padding:1px 6px;border-radius:20px;color:${bc.color};letter-spacing:.06em">${bc.label}</span>
          </div>
          ${isSel?`
            <div style="display:flex;gap:4px;margin-top:8px;padding-top:7px;border-top:.5px solid rgba(139,106,32,.2)">
              <button onclick="sendAction('team','${p.player_id}','${p.username}')"   style="flex:1;font-family:'IM Fell English',serif;font-size:.8rem;padding:5px 3px;border-radius:3px;border:.5px solid #5ec45e40;cursor:pointer;background:none;color:#3a6a3a">🤝 Team</button>
              <button onclick="sendAction('attack','${p.player_id}','${p.username}')" style="flex:1;font-family:'IM Fell English',serif;font-size:.8rem;padding:5px 3px;border-radius:3px;border:.5px solid #e0555540;cursor:pointer;background:none;color:#6a2a2a">⚔ Attack</button>
              <button onclick="sendAction('observe','${p.player_id}','${p.username}')" style="flex:1;font-family:'IM Fell English',serif;font-size:.8rem;padding:5px 3px;border-radius:3px;border:.5px solid #a07de040;cursor:pointer;background:none;color:#3a3a6a">👁 Observe</button>
            </div>
          `:''}
        </div>
      `
    }).join('')

    document.querySelectorAll('[data-pid]').forEach(el=>{
      el.addEventListener('click', e=>{
        if (e.target.tagName==='BUTTON') return
        const pid = el.dataset.pid
        selected = selected===pid ? null : pid
        renderList()
      })
    })
  }

  // ── Observe: show player profile modal ─────────────────
  window.sendAction = async (type, targetId, targetName) => {
    if (type === 'observe') {
      showObserveModal(targetId, targetName)
      return
    }

    if (type === 'team') {
      showTeamRequestModal(targetId, targetName)
      return
    }

    if (type === 'attack') {
      showAttackModal(targetId, targetName)
      return
    }
  }

  // ── Observe Modal ─────────────────────────────────────
  async function showObserveModal(targetId, targetName) {
    document.getElementById('observe-modal')?.remove()
    // Fetch target player data
    const { data: tp } = await supabase.from('players').select('*').eq('id', targetId).single()
    const { data: tpres } = await supabase.from('presence').select('*').eq('player_id', targetId).single()

    const modal = document.createElement('div')
    modal.id = 'observe-modal'
    modal.style.cssText = 'position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75)'

    const badge = tp?.badge || 'neutral'
    const bc2 = BC[badge] || BC.neutral
    const pvpKills   = tp?.pvp_kills   || 0
    const helpsGiven = tp?.helps_given || 0
    const backstabs  = tp?.backstabs   || 0
    const reputation = tp?.reputation  || 'neutral'

    modal.innerHTML = `
      <div style="background:#b8a568;border:1px solid #8b6a20;border-radius:6px;padding:1.25rem;min-width:300px;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.8)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
          <p style="font-family:'Cinzel',serif;font-size:1rem;font-weight:600;color:#1a1208">Player Profile</p>
          <button onclick="document.getElementById('observe-modal').remove()" style="background:none;border:none;font-size:1.1rem;cursor:pointer;color:#1a1208">✕</button>
        </div>
        <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;padding:.6rem;background:rgba(0,0,0,.08);border-radius:4px">
          <div style="width:44px;height:44px;border-radius:50%;border:2px solid ${bc2.color};display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;color:${bc2.color};background:rgba(0,0,0,.2);flex-shrink:0">${targetName[0].toUpperCase()}</div>
          <div>
            <p style="font-family:'Cinzel',serif;font-size:.95rem;font-weight:600;color:#1a1208;margin:0 0 2px">${targetName}</p>
            <p style="font-family:'Share Tech Mono',monospace;font-size:.55rem;color:${bc2.color};margin:0;letter-spacing:.06em">${bc2.label} · Level ${tp?.level||'?'}</p>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:.75rem">
          ${[
            ['Reputation', reputation, '#c8b96e'],
            ['Element', tp?.element||'—', '#a8d8ea'],
            ['⚔ PVP Kills', pvpKills, '#e05555'],
            ['🤝 Helps Given', helpsGiven, '#5ec45e'],
            ['🗡 Backstabs', backstabs, '#b06eff'],
            ['Chapter', tp?.current_chapter||1, '#c8b96e'],
          ].map(([k,v,c]) => '<div style="background:rgba(0,0,0,.1);border-radius:3px;padding:5px 7px"><span style="font-family:\'Share Tech Mono\',monospace;font-size:.5rem;color:#3a2008;display:block">'+k+'</span><span style="font-family:\'Cinzel\',serif;font-size:.82rem;font-weight:600;color:'+c+'">'+v+'</span></div>').join('')}
        </div>
        <p style="font-family:'Share Tech Mono',monospace;font-size:.55rem;color:#3a2008;letter-spacing:.06em">
          Status: <span style="color:${(SC[tpres?.status||'online']||SC.online).color}">${(SC[tpres?.status||'online']||SC.online).label}</span>
        </p>
      </div>
    `
    modal.addEventListener('click', e => { if (e.target===modal) modal.remove() })
    document.body.appendChild(modal)
    addPing('Observing ' + targetName, 'neutral')
  }

  // ── Team Request Modal ────────────────────────────────
  async function showTeamRequestModal(targetId, targetName) {
    document.getElementById('team-modal')?.remove()
    const modal = document.createElement('div')
    modal.id = 'team-modal'
    modal.style.cssText = 'position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75)'
    modal.innerHTML = `
      <div style="background:#b8a568;border:1px solid #5ec45e;border-radius:6px;padding:1.25rem;min-width:280px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.8)">
        <p style="font-family:'Cinzel',serif;font-size:1rem;font-weight:600;color:#1a1208;margin-bottom:.5rem">Alliance Request</p>
        <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.88rem;color:#1a1208;margin-bottom:.75rem">
          Send a team request to <strong>${targetName}</strong>?<br>
          They will be notified and can accept or decline.
        </p>
        <div style="display:flex;gap:6px">
          <button onclick="confirmTeam('${targetId}','${targetName}')" style="flex:1;font-family:'Cinzel',serif;font-size:.8rem;color:#1a1208;background:rgba(94,196,94,.3);border:1px solid #5ec45e;border-radius:3px;padding:.45rem;cursor:pointer">🤝 Send Request</button>
          <button onclick="document.getElementById('team-modal').remove()" style="flex:1;font-family:'Cinzel',serif;font-size:.8rem;color:#1a1208;background:rgba(200,184,128,.2);border:1px solid rgba(139,106,32,.4);border-radius:3px;padding:.45rem;cursor:pointer">Cancel</button>
        </div>
      </div>
    `
    modal.addEventListener('click', e => { if (e.target===modal) modal.remove() })
    document.body.appendChild(modal)
  }

  window.confirmTeam = async (targetId, targetName) => {
    document.getElementById('team-modal')?.remove()
    await supabase.from('encounters').insert({
      initiator_id: player.id, target_id: targetId,
      chapter, result: 'team_request'
    })
    addPing('Alliance request sent to ' + targetName, 'green')
    showToast('Team request sent to ' + targetName)
    // Notify target via realtime
    await supabase.channel('notify:' + targetId).send({
      type: 'broadcast', event: 'team_request',
      payload: { from: player.username, fromId: player.id }
    })
    selected = null
    renderList()
  }

  // ── Attack Modal ──────────────────────────────────────
  async function showAttackModal(targetId, targetName) {
    document.getElementById('attack-modal')?.remove()
    const modal = document.createElement('div')
    modal.id = 'attack-modal'
    modal.style.cssText = 'position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75)'
    modal.innerHTML = `
      <div style="background:#b8a568;border:1px solid #e05555;border-radius:6px;padding:1.25rem;min-width:280px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.8)">
        <p style="font-family:'Cinzel',serif;font-size:1rem;font-weight:600;color:#1a1208;margin-bottom:.5rem">⚔ Initiate PVP</p>
        <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.88rem;color:#1a1208;margin-bottom:.4rem">
          Challenge <strong>${targetName}</strong> to combat?
        </p>
        <p style="font-family:'Share Tech Mono',monospace;font-size:.58rem;color:#c04040;margin-bottom:.75rem">
          ⚠ This will shift your reputation toward Red.
        </p>
        <div style="display:flex;gap:6px">
          <button onclick="confirmAttack('${targetId}','${targetName}')" style="flex:1;font-family:'Cinzel',serif;font-size:.8rem;color:#1a1208;background:rgba(224,85,85,.25);border:1px solid #e05555;border-radius:3px;padding:.45rem;cursor:pointer">⚔ Attack</button>
          <button onclick="document.getElementById('attack-modal').remove()" style="flex:1;font-family:'Cinzel',serif;font-size:.8rem;color:#1a1208;background:rgba(200,184,128,.2);border:1px solid rgba(139,106,32,.4);border-radius:3px;padding:.45rem;cursor:pointer">Cancel</button>
        </div>
      </div>
    `
    modal.addEventListener('click', e => { if (e.target===modal) modal.remove() })
    document.body.appendChild(modal)
  }

  window.confirmAttack = async (targetId, targetName) => {
    document.getElementById('attack-modal')?.remove()
    await supabase.from('encounters').insert({
      initiator_id: player.id, target_id: targetId,
      chapter, result: 'pvp_initiated'
    })
    // Update reputation
    await supabase.from('players').update({ reputation: 'red', badge: 'red' }).eq('id', player.id)
    // Notify target
    await supabase.channel('notify:' + targetId).send({
      type: 'broadcast', event: 'pvp_challenge',
      payload: { from: player.username, fromId: player.id }
    })
    addPing('Attack initiated on ' + targetName, 'red')
    showToast('Challenge sent to ' + targetName)
    selected = null
    renderList()
  }

  // ── Listen for incoming notifications ────────────────
  supabase.channel('notify:' + player.id)
    .on('broadcast', { event: 'team_request' }, ({ payload }) => {
      showIncomingRequest('team', payload.from, payload.fromId)
    })
    .on('broadcast', { event: 'pvp_challenge' }, ({ payload }) => {
      showIncomingRequest('pvp', payload.from, payload.fromId)
    })
    .subscribe()

  function showIncomingRequest(type, fromName, fromId) {
    document.getElementById('incoming-modal')?.remove()
    const isPvp = type === 'pvp'
    const modal = document.createElement('div')
    modal.id = 'incoming-modal'
    modal.style.cssText = 'position:fixed;top:80px;right:20px;z-index:800;min-width:260px;max-width:320px;background:'+(isPvp?'#4a1a1a':'#1a3a1a')+';border:1px solid '+(isPvp?'#e05555':'#5ec45e')+';border-radius:6px;padding:1rem;box-shadow:0 8px 40px rgba(0,0,0,.8);animation:fadeIn .3s ease'
    modal.innerHTML = `
      <p style="font-family:'Cinzel',serif;font-size:.88rem;font-weight:600;color:${isPvp?'#e05555':'#5ec45e'};margin-bottom:.4rem">
        ${isPvp?'⚔ PVP Challenge!':'🤝 Alliance Request!'}
      </p>
      <p style="font-family:'IM Fell English',serif;font-style:italic;font-size:.82rem;color:#d4c090;margin-bottom:.75rem">
        <strong>${fromName}</strong> wants to ${isPvp?'fight you':'team up with you'}.
      </p>
      <div style="display:flex;gap:6px">
        <button onclick="respondRequest('accept','${type}','${fromId}','${fromName}')" style="flex:1;font-family:'Cinzel',serif;font-size:.75rem;color:#1a1208;background:rgba(${isPvp?'224,85,85':'94,196,94'},.4);border:1px solid ${isPvp?'#e05555':'#5ec45e'};border-radius:3px;padding:.4rem;cursor:pointer">Accept</button>
        <button onclick="respondRequest('decline','${type}','${fromId}','${fromName}')" style="flex:1;font-family:'Cinzel',serif;font-size:.75rem;color:#c8c0a0;background:rgba(200,184,128,.1);border:.5px solid rgba(200,184,128,.3);border-radius:3px;padding:.4rem;cursor:pointer">Decline</button>
      </div>
    `
    document.body.appendChild(modal)
    setTimeout(() => modal.remove(), 30000)
  }

  window.respondRequest = async (response, type, fromId, fromName) => {
    document.getElementById('incoming-modal')?.remove()
    await supabase.from('encounters').insert({
      initiator_id: fromId, target_id: player.id,
      chapter, result: type + '_' + response
    })
    if (response === 'accept') {
      showToast(type === 'pvp' ? 'PVP challenge accepted!' : 'Alliance formed with ' + fromName)
      addPing((type==='pvp'?'PVP accepted from ':'Allied with ') + fromName, type==='pvp'?'red':'green')
    } else {
      showToast('Request from ' + fromName + ' declined')
    }
  }

  // Realtime
  supabase.channel('lobby:ch'+chapter)
    .on('postgres_changes',{event:'*',schema:'public',table:'presence',filter:`chapter=eq.${chapter}`}, payload=>{
      const row = payload.new
      if (!row||row.player_id===player.id) return
      if (payload.eventType==='INSERT') addPing(`${row.username} entered the area`, row.badge||'neutral')
      load()
    }).subscribe()

  setInterval(()=>{
    supabase.from('presence').upsert({player_id:player.id,username:player.username,chapter,node:player.current_node||'opening',badge:player.badge||'neutral',level:player.level||1,status:'online'},{onConflict:'player_id'})
  }, 20000)

  await load()
</script>
</body>
</html>
